[project]
name = "permitflow-mcp"
version = "0.1.0"
description = "PermitFlow Permit Readiness & Portfolio Intelligence MCP Server – An educational prototype for construction permit workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ROHIX RB License" }

dependencies = [
    "mcp[cli]>=1.0.0,<2",

    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "PyMuPDF>=1.24.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
permitflow-mcp = "permitflow_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitflow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
