[project]
name = "permitflow-mcp"
version = "0.1.0"
description = "PermitFlow Permit Readiness & Portfolio Intelligence MCP Server – An educational prototype for construction permit workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ROHIX RB License" }

dependencies = [
    "mcp[cli]>=1.0.0,<2",

    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
permitflow-mcp = "permitflow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitflow_mcp"]
